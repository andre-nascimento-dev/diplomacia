<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recado</title>
<style>
  :root { --bg: #f6f7f8; --fg: #17212b; --muted: #5d6874; --ok: #1f8a70; --off: #b3261e; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1419; --fg: #e8edf2; --muted: #9aa6b2; --ok: #3fb68f; --off: #f2827a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 16px; padding: 16px;
    background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  h1 { margin: 0; font-size: 28px; }
  h1.ok { color: var(--ok); }
  h1.off { color: var(--off); }
  p { margin: 0; max-width: 420px; color: var(--muted); }
  img { width: 280px; height: 280px; background: #fff; padding: 12px; border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1 id="state" role="status" aria-live="polite">Não conectado</h1>
<p id="detail"></p>
<img id="qr" alt="QR code para vincular o celular" hidden>
<script>
  async function refresh() {
    try {
      const s = await window.go.main.App.Status();
      document.getElementById("state").textContent = s.connected ? "Conectado" : "Não conectado";
      document.getElementById("state").className = s.connected ? "ok" : "off";
      document.getElementById("detail").textContent = s.connected ? "" : s.detail;
      document.getElementById("qr").hidden = !s.qr;
      if (s.qr) document.getElementById("qr").src = s.qr;
    } catch (err) {
      document.getElementById("detail").textContent = String(err);
    }
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
